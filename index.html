<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --bg-soft:#f2f6fd; --panel:#ffffff; --panel-2:#eaf1ff;
  --ink:#0a1626; --ink-mid:#45586f; --line:#dce6f6;
  --brand:#1857e6; --brand-strong:#0b3fbf; --brand-tint:#e9f0ff; --accent:#2f8bff;
  --white:#ffffff; --radius:20px; --radius-sm:13px;
  --shadow:0 24px 60px -30px rgba(16,54,120,.42);
  --shadow-sm:0 12px 30px -18px rgba(16,54,120,.32);
  --maxw:1160px;
  --ff-display:"Sora",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --ff-body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --ff-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080f1a; --bg-soft:#0b1626; --panel:#0e1c30; --panel-2:#122a46;
    --ink:#e9f1fc; --ink-mid:#9db3d1; --line:#1e3557;
    --brand:#3d7bff; --brand-strong:#5a90ff; --brand-tint:#12345c; --accent:#4c98ff; --white:#0e1c30;
    --shadow:0 24px 60px -28px rgba(0,0,0,.7); --shadow-sm:0 12px 30px -18px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#080f1a; --bg-soft:#0b1626; --panel:#0e1c30; --panel-2:#122a46;
  --ink:#e9f1fc; --ink-mid:#9db3d1; --line:#1e3557;
  --brand:#3d7bff; --brand-strong:#5a90ff; --brand-tint:#12345c; --accent:#4c98ff; --white:#0e1c30;
  --shadow:0 24px 60px -28px rgba(0,0,0,.7); --shadow-sm:0 12px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
  min-height:100vh;display:flex;flex-direction:column}
h1{font-family:var(--ff-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;width:100%}
main{flex:1;display:flex;align-items:center}

.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:"";position:absolute;border-radius:50%;filter:blur(100px);opacity:.5}
.bg-glow::before{width:560px;height:560px;background:radial-gradient(circle,var(--brand-tint),transparent 70%);top:-180px;right:-120px}
.bg-glow::after{width:480px;height:480px;background:radial-gradient(circle,rgba(47,139,255,.16),transparent 70%);bottom:-160px;left:-160px}

header{position:sticky;top:0;z-index:40;backdrop-filter:saturate(150%) blur(14px);
  background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
/* a fejléc a teljes ablakszélességet használja: logó teljesen balra, nyelvek teljesen jobbra */
header .wrap{max-width:none;padding:0 26px}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand-group{display:flex;align-items:center;gap:14px;min-width:0}
.header-tagline{display:flex;align-items:center;gap:8px;font-family:var(--ff-mono);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-mid);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* a gomb 22px (könnyen eltalálható), a látható pötty belül 6px */
.header-tagline .pulse{width:22px;height:22px;border:0;padding:0;background:none;flex:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;appearance:none;-webkit-appearance:none}
.header-tagline .pulse::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--dot,var(--brand));animation:pulse 2.2s infinite;transition:background .2s ease}
.header-tagline .pulse:hover::before{transform:scale(1.5)}
.header-tagline .pulse:focus-visible{outline:2px solid var(--dot,var(--brand));outline-offset:2px;border-radius:50%}
@media (max-width:560px){.header-tagline{display:none}}

/* contact chips in sticky bar */
.nav-contacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.contact-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  font-family:var(--ff-mono);font-size:.8rem;font-weight:600;border:1px solid;white-space:nowrap;transition:transform .16s ease}
.contact-chip:hover{transform:translateY(-1px)}
.contact-chip svg{width:15px;height:15px;flex:none}
.contact-chip.wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.45);color:#0f8a3e}
:root[data-theme="dark"] .contact-chip.wa{color:#3ddc84}
.contact-chip.mail{background:var(--brand-tint);border-color:color-mix(in srgb,var(--brand) 35%,transparent);color:var(--brand-strong)}
.copy-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
  background:var(--brand);color:#fff;border:0;cursor:pointer;flex:none;transition:background .16s ease,transform .16s ease}
.copy-icon:hover{background:var(--brand-strong);transform:translateY(-1px)}
.copy-icon svg{width:14px;height:14px}
.copy-icon.done{background:#16a34a}
@media (max-width:640px){
  .contact-chip{font-size:.72rem;padding:7px 11px}
  .copy-icon{width:28px;height:28px}
}

/* sticky bottom bar */
body{padding-bottom:110px}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:45;backdrop-filter:saturate(150%) blur(14px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:1px solid var(--line);
  box-shadow:0 -10px 34px -22px rgba(16,54,120,.3)}
.sticky-bar-inner{display:flex;align-items:center;justify-content:center;gap:20px;padding:14px 22px;flex-wrap:wrap}
.tier{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:13px;color:#fff;text-align:left;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:background .16s ease;
  font-family:var(--ff-body)}
.tier:hover{background:rgba(255,255,255,.18)}
.tier .tname{font-family:var(--ff-display);font-weight:800;font-size:.92rem}
.tier .tdesc{font-size:.74rem;opacity:.82;margin-top:2px;line-height:1.35}
.tier-hint{display:block;text-align:center;font-family:var(--ff-mono);font-size:.68rem;color:#fff;opacity:.72;margin-top:4px}
@media (max-width:560px){
  body{padding-bottom:158px}
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.brand .oi{color:var(--brand)}
.brand .mk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-strong));color:#fff;font-weight:800;font-size:.9rem;box-shadow:0 6px 16px -6px var(--brand)}
.lang{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font-family:var(--ff-mono);font-size:.72rem;font-weight:600;letter-spacing:.04em;border:0;background:transparent;
  color:var(--ink-mid);padding:5px 9px;border-radius:999px;cursor:pointer;transition:.18s}
.lang button:hover{color:var(--brand)}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}

.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--ff-display);font-weight:600;font-size:.98rem;
  padding:14px 24px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:transform .16s ease,box-shadow .2s,background .18s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 14px 30px -12px var(--brand)}
.btn-primary:hover{background:var(--brand-strong);transform:translateY(-2px);box-shadow:0 20px 34px -14px var(--brand)}
.btn-shout{text-transform:uppercase;letter-spacing:.05em;font-size:.86rem;padding:17px 30px}

/* hero */
.hero{padding:8px 0;text-align:center;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--ff-mono);font-size:.8rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brand-strong);font-weight:600;background:var(--brand-tint);
  border:1px solid color-mix(in srgb,var(--brand) 26%,transparent);padding:8px 18px;border-radius:999px}
.eyebrow .pulse{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 2.2s infinite}50%{opacity:0}}
.hero-sub{font-size:1.12rem;color:var(--ink-mid);max-width:62ch;margin:20px auto 0}
.hero-cta{display:flex;justify-content:center;margin-top:32px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--dot,var(--brand)) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* --- csillag buborék és a projektek lila panelje --- */
.pkg-toggle{border:0;border-radius:50%;cursor:pointer;color:#fff;
  background:linear-gradient(150deg,#22c55e,#15803d);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px #15803d;
  transition:transform .18s ease,box-shadow .18s ease}
.pkg-toggle:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 18px 34px -12px #15803d}
.pkg-toggle svg{width:42px;height:42px}

.pkg-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:380px;
  max-width:calc(100vw - 36px);max-height:78vh;overflow-y:auto;z-index:60;opacity:0;pointer-events:none;
  background:linear-gradient(155deg,#22c55e,#15803d);border-radius:24px;padding:18px 18px 20px;
  box-shadow:0 34px 76px -22px rgba(21,128,61,.6);transition:opacity .26s ease,transform .3s cubic-bezier(.22,1.3,.4,1)}
.pkg-panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pkg-head{display:flex;align-items:center;gap:9px;color:#fff;font-family:var(--ff-display);
  font-weight:800;font-size:1.02rem;margin-bottom:13px}
.pkg-head svg{width:21px;height:21px;flex:none}
.pkg-close{margin-left:auto;width:29px;height:29px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.2);color:#fff;font-size:.98rem;line-height:1;display:flex;
  align-items:center;justify-content:center;transition:background .16s ease}
.pkg-close:hover{background:rgba(255,255,255,.34)}
.pkg-list{display:flex;flex-direction:column;gap:8px}
.mail-toggle{border:0;border-radius:50%;cursor:pointer;color:#fff;
  background:linear-gradient(150deg,#ef4444,#dc2626);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px #dc2626;
  transition:transform .18s ease,box-shadow .18s ease}
.mail-toggle:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 18px 34px -12px #dc2626}
.mail-toggle svg{width:42px;height:42px}
.star-toggle{border:0;border-radius:50%;cursor:pointer;background:linear-gradient(150deg,#7c3aed,#5b21b6);
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px #7c3aed;
  transition:transform .18s ease,box-shadow .18s ease}
.star-toggle:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 18px 34px -12px #7c3aed}
.star-toggle svg{width:46px;height:46px}
.star-toggle.hidden{display:none}

.proj-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:520px;
  max-width:calc(100vw - 36px);max-height:78vh;overflow-y:auto;z-index:60;opacity:0;pointer-events:none;
  background:linear-gradient(155deg,#7c3aed,#5b21b6);border-radius:26px;padding:20px 20px 22px;
  box-shadow:0 34px 76px -22px rgba(76,29,149,.65);transition:opacity .26s ease,transform .3s cubic-bezier(.22,1.3,.4,1)}
.proj-panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.proj-head{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--ff-display);
  font-weight:800;font-size:1.06rem;margin-bottom:14px}
.proj-head svg{width:22px;height:22px;flex:none}
.proj-close{margin-left:auto;width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.18);color:#fff;font-size:1rem;line-height:1;display:flex;
  align-items:center;justify-content:center;transition:background .16s ease}
.proj-close:hover{background:rgba(255,255,255,.32)}
.proj-list{display:flex;flex-direction:column;gap:9px}
.proj{text-align:left;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);
  color:#fff;border-radius:15px;padding:12px 15px;cursor:pointer;font-family:var(--ff-display);
  font-weight:700;font-size:.92rem;line-height:1.3;transition:background .18s ease,transform .18s ease}
.proj:hover{background:rgba(255,255,255,.22);transform:translateX(3px)}
.proj.open{background:rgba(255,255,255,.94);color:#4c1d95;font-family:var(--ff-body);
  font-weight:500;font-size:.88rem;line-height:1.5;transform:none}

/* --- körpálya: középen az oi jel (logó-formájú), körülötte a kerek buborékok --- */
.orbit{position:relative;width:100%;height:420px;max-height:62vh}
.orbit-core{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;
  border:0;border-radius:31px;cursor:pointer;z-index:3;
  background:linear-gradient(150deg,var(--brand),var(--brand-strong));color:#fff;
  font-family:var(--ff-display);font-weight:800;font-size:2.2rem;letter-spacing:-.02em;
  display:grid;place-items:center;box-shadow:0 20px 44px -14px var(--brand);
  transform:scale(.7);                       /* kinn vannak a körök: kisebb */
  transition:transform .5s cubic-bezier(.22,1.35,.4,1)}
.orbit-core:hover{transform:scale(.76)}
.orbit-core.closed{transform:scale(1.22)}    /* beszippantva: nagyobb */
.orbit-core.closed:hover{transform:scale(1.3)}
/* a pályára került buborékok: nem a képernyő sarkához, hanem az oi jelhez igazodnak */
.orbit .orb{position:absolute;left:50%;top:50%;margin:0;z-index:2;width:92px;height:92px;
  
  transition:transform .6s cubic-bezier(.22,1.3,.4,1),opacity .45s ease}
.orbit.closed .orb{opacity:0;pointer-events:none}
@media (max-width:900px){.orbit{height:min(58vh,430px)}}
@media (max-width:560px){
  .orbit .orb{width:78px;height:78px}
  .intro-toggle svg,.edu-toggle svg{width:36px;height:36px}
  .star-toggle svg,.mail-toggle svg,.pkg-toggle svg{width:36px;height:36px}
  .ttt-toggle{font-size:1.6rem}
  .orbit-core{width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:27px;font-size:1.9rem}
}

/* flow diagram */
.flow-diagram{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:0}
.flow-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:640px}
.flow-row.out{max-width:860px;gap:9px}
.flow-chip{font-family:var(--ff-mono);font-weight:600;font-size:.82rem;letter-spacing:.02em;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:11px 18px;box-shadow:var(--shadow-sm);color:var(--ink-mid);
  transition:transform .18s ease,border-color .18s,color .18s,background .18s}
.flow-chip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));color:var(--brand)}
/* a két bal oldali buborék kattintható, a másik kettő natúr marad */
.flow-row.in .pick-chip{cursor:pointer;user-select:none}
.flow-row.in .pick-chip.c-red,.flow-row.in .pick-chip.c-red:hover{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:#dc2626;color:#fff}
.flow-row.in .pick-chip.c-blue,.flow-row.in .pick-chip.c-blue:hover{background:linear-gradient(135deg,var(--brand),var(--brand-strong));border-color:var(--brand-strong);color:#fff}
.flow-row.in .pick-chip.c-green,.flow-row.in .pick-chip.c-green:hover{background:linear-gradient(135deg,#25d366,#0f8a3e);border-color:#0f8a3e;color:#fff}
/* output chips — húzással átrendezhetők */
.flow-row.out .flow-chip{cursor:grab;user-select:none;touch-action:none;font-size:.73rem;padding:9px 13px;will-change:transform}
.flow-row.out .flow-chip::before{content:"⠿";opacity:.35;margin-right:7px;letter-spacing:0;transition:opacity .18s}
.flow-row.out .flow-chip:active{cursor:grabbing}
.flow-row.out .flow-chip.dragging{cursor:grabbing;position:relative;z-index:6;transition:none!important;
  background:linear-gradient(135deg,var(--brand),var(--brand-strong));border-color:var(--brand-strong);color:#fff;
  box-shadow:0 24px 44px -14px var(--brand)}
.flow-row.out .flow-chip.dragging::before{opacity:.8}
.flow-row.out .flow-chip.settling{transition:transform .44s cubic-bezier(.28,1.2,.42,1),
  background .38s ease,color .38s ease,border-color .38s ease,box-shadow .38s ease}
.flow-row.out.sorting .flow-chip:hover{transform:none}
.flow-row.out.sorting{cursor:grabbing}
.flow-link{width:2px;height:40px;background:linear-gradient(var(--line),var(--brand));position:relative;margin:4px 0}
.flow-link .dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:var(--panel);border:1.5px solid var(--line);animation:dotfill 1.8s ease-in-out infinite}
.flow-link.l1 .dot{animation-delay:0s}
.flow-link.l3 .dot{animation-delay:.6s}
@keyframes dotfill{
  0%,100%{background:var(--panel);border-color:var(--line);box-shadow:none}
  50%{background:var(--brand);border-color:var(--brand);box-shadow:0 0 8px 2px color-mix(in srgb,var(--brand) 55%,transparent)}
}
.flow-core{padding:12px 28px;border-radius:16px;font-family:var(--ff-display);font-weight:700;letter-spacing:.01em;
  text-align:center;font-size:clamp(1rem,2.6vw,1.25rem);display:flex;align-items:center;gap:10px}
.flow-core.ai{background:linear-gradient(135deg,var(--brand),var(--brand-strong));color:#fff;box-shadow:0 16px 34px -16px var(--brand)}
.flow-core.ai{cursor:pointer;transition:transform .5s cubic-bezier(.22,1.35,.4,1),opacity .4s ease}
.flow-core.ai.collapsed{transform:scale(.78);box-shadow:0 10px 22px -8px var(--brand);
  transition:transform .48s cubic-bezier(.5,-0.2,.6,1.4);animation:corebeat 2.4s ease-in-out .6s infinite}
@keyframes corebeat{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.flow-diagram.sucking .flow-chip,.flow-diagram.sucking .flow-link{pointer-events:none}
.flow-core.ai .ai-sm{font-size:.66em;font-weight:800;letter-spacing:.04em;opacity:.92}
.flow-core svg{width:20px;height:20px;flex:none}


footer{border-top:1px solid var(--line);padding:30px 0;color:var(--ink-mid);font-size:.9rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

@media (max-width:560px){
  .hero{padding:8px 0}
  .flow-chip{font-size:.76rem;padding:10px 14px}

/* --- Szeged: hőmérséklet + pontos idő (bal oldalt középen) --- */

.wx-search{position:absolute;left:0;top:calc(100% + 8px);width:212px;z-index:2;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:var(--shadow)}

/* --- küldetés panel: a fejléc feliratára kattintva gördül le --- */
.tagline-btn{border:0;padding:0;background:none;font:inherit;color:inherit;letter-spacing:inherit;
  cursor:pointer;appearance:none;-webkit-appearance:none;transition:color .16s ease}

.mission-panel{position:fixed;top:76px;left:22px;width:340px;max-width:calc(100vw - 44px);z-index:41;

.mission-head{display:flex;align-items:center;gap:8px;font-family:var(--ff-display);font-weight:700;

/* --- bemutatkozás buborék (bal felül, az oktatás sapka fölött) --- */
.intro-toggle{z-index:39;width:50px;height:50px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--brand),var(--brand-strong));color:#fff;cursor:pointer;

/* --- oktatás widget (az amőba tükörképe, bal oldalt) --- */
.edu-corner{position:fixed;top:140px;left:22px;width:196px;z-index:39;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:13px;box-shadow:var(--shadow);display:none}

  transition:transform .18s ease,box-shadow .18s ease}
.edu-toggle:hover{transform:translateY(-2px);box-shadow:0 18px 32px -12px #ea580c}

.edu-toggle svg{width:42px;height:42px}

/* --- tic-tac-toe (amőba) widget --- */
.ttt-corner{position:fixed;top:78px;right:22px;width:288px;z-index:39;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:13px;box-shadow:var(--shadow);display:none}
.ttt-corner.open{display:block}
.ttt-toggle{font-size:1.9rem;z-index:39;width:50px;height:50px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--brand),var(--brand-strong));color:#fff;font-size:1.15rem;font-weight:800;cursor:pointer;
  box-shadow:0 14px 28px -12px var(--brand);align-items:center;justify-content:center;display:flex;font-family:var(--ff-display);
  transition:transform .18s ease,box-shadow .18s ease}
.ttt-toggle:hover{transform:translateY(-2px);box-shadow:0 18px 32px -12px var(--brand)}
.ttt-toggle.hidden{display:none}
.ttt-head{display:flex;align-items:center;gap:7px;font-family:var(--ff-display);font-weight:700;font-size:.86rem;
  color:var(--ink);margin-bottom:9px;cursor:pointer;user-select:none;transition:color .16s ease}
.ttt-head:hover{color:var(--brand)}
.ttt-head .ttt-collapse{margin-left:auto;opacity:.5;font-size:.9rem;line-height:1}
.ttt-board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;width:100%;aspect-ratio:1}
.ttt-cell{min-width:0;min-height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#eef4ff;border:1px solid var(--line);
  border-radius:6px;cursor:pointer;user-select:none;font-family:var(--ff-display);font-weight:800;
  font-size:clamp(11px,1.7vw,15px);line-height:1;transition:background .14s ease,transform .14s ease}
.ttt-cell:hover:not(.taken){background:var(--brand-tint);transform:translateY(-1px)}
.ttt-cell.taken{cursor:default}
.ttt-cell.x{color:#dc2626}
.ttt-cell.o{color:#16a34a}
.ttt-cell.win{background:var(--brand);border-color:var(--brand)}
.ttt-cell.win.x,.ttt-cell.win.o{color:#fff}
.modal-card .ttt-cell{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.5)}
.ttt-status{margin-top:9px;font-family:var(--ff-mono);font-size:.7rem;color:var(--ink-mid);text-align:center;min-height:15px}
.modal-card .ttt-status{color:rgba(255,255,255,.9)}
.ttt-reset{margin-top:8px;width:100%;justify-content:center;font-size:.78rem;padding:8px 14px;gap:7px;
  background:var(--brand-tint);color:var(--brand-strong);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);
  border-radius:999px;font-family:var(--ff-display);font-weight:600;cursor:pointer;display:flex;align-items:center}
.ttt-reset:hover{background:color-mix(in srgb,var(--brand-tint) 60%,var(--brand) 12%)}
.modal-card .ttt-reset{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.32)}
.modal-card .ttt-reset:hover{background:rgba(255,255,255,.26)}

/* --- contact channel picker --- */
.channel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.channel-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:13px;

.channel-btn svg{width:15px;height:15px;flex:none}
#contact-detail-field{display:none}
#contact-detail-field.show{display:block}

/* ---------- output buborékok: élő, húzható átrendezés (FLIP) ---------- */
(function(){
  const row=document.getElementById("out-row");
  if(!row) return;
  const EASE="transform .46s cubic-bezier(.25,.8,.3,1)";
  const COOLDOWN=280;   /* két átrendezés között ennyi ms szünet — hogy az animáció be tudjon fejeződni */
  const DEADZONE=.22;   /* a célbuborék közepe körüli holtsáv (szélesség arányában) */
  let drag=null, frame=null, lastMove=0;

  /* a húzott buborék a kurzor alatt marad, megemelve + kissé megdöntve */
  function paint(){
    frame=null;
    if(!drag) return;
    /* a buborék nem hagyhatja el a saját sávját — csak azon belül mozoghat */
    const b=drag.bounds;
    const px=Math.max(b.left,Math.min(drag.x-drag.grabX,b.right-drag.base.width));
    const py=Math.max(b.top, Math.min(drag.y-drag.grabY,b.bottom-drag.base.height));
    const tx=px-drag.base.left;
    const ty=py-drag.base.top;
    const tilt=Math.max(-4,Math.min(4,(drag.x-drag.lastX)*0.45));
    drag.tilt+=(tilt-drag.tilt)*0.16;
    drag.lastX=drag.x;
    drag.el.style.transform="translate("+tx+"px,"+ty+"px) scale(1.08) rotate("+drag.tilt.toFixed(2)+"deg)";
  }
  function schedule(){ if(!frame) frame=requestAnimationFrame(paint); }

  /* a kurzorhoz legközelebbi buborék (a függőleges távolság nagyobb súllyal, hogy a sorok elkülönüljenek) */
  function nearest(){
    let best=null,bd=Infinity;
    for(const el of row.children){
      if(el===drag.el) continue;
      const r=el.getBoundingClientRect();
      const dx=drag.x-(r.left+r.width/2), dy=(drag.y-(r.top+r.height/2))*1.7;
      const d=dx*dx+dy*dy;
      if(d<bd){bd=d;best={el:el,r:r};}
    }
    return best;
  }

  /* átrendezés: a többi buborék a régi helyéről simán átcsúszik az újra */
  function reflow(){
    const now=performance.now();
    if(now-lastMove<COOLDOWN) return;          /* hagyjuk befejeződni az előző animációt */
    const target=nearest();
    if(!target) return;
    const mid=target.r.left+target.r.width/2;
    if(Math.abs(drag.x-mid)<target.r.width*DEADZONE) return;  /* a közép körül ne kapkodjon */
    const ref=(drag.x<mid)?target.el:target.el.nextSibling;
    if(ref===drag.el||drag.el.nextSibling===ref) return;
    lastMove=now;

    const items=Array.prototype.slice.call(row.children);
    const prev=new Map(items.map(el=>[el,el.getBoundingClientRect()]));
    drag.el.style.transform="";
    row.insertBefore(drag.el,ref);
    drag.base=drag.el.getBoundingClientRect();
    const rr2=row.getBoundingClientRect(), pad2=14;
    drag.bounds={left:rr2.left-pad2,top:rr2.top-pad2,right:rr2.right+pad2,bottom:rr2.bottom+pad2};
    items.forEach(el=>{
      if(el===drag.el) return;
      const p=prev.get(el), n=el.getBoundingClientRect();
      const dx=p.left-n.left, dy=p.top-n.top;
      if(!dx&&!dy) return;
      el.style.transition="none";
      el.style.transform="translate("+dx+"px,"+dy+"px)";
      void el.offsetWidth;
      el.style.transition=EASE;
      el.style.transform="";
    });
    paint();
  }

  row.querySelectorAll(".flow-chip").forEach(chip=>{
    chip.addEventListener("pointerdown",(e)=>{
      if(e.button&&e.button!==0) return;
      e.preventDefault();
      chip.classList.remove("settling");
      chip.style.transition="";
      const b=chip.getBoundingClientRect();
      const rr=row.getBoundingClientRect(), pad=14;
      drag={el:chip,base:b,grabX:e.clientX-b.left,grabY:e.clientY-b.top,
            x:e.clientX,y:e.clientY,lastX:e.clientX,tilt:0,
            bounds:{left:rr.left-pad,top:rr.top-pad,right:rr.right+pad,bottom:rr.bottom+pad}};
      lastMove=0;
      chip.classList.add("dragging");
      row.classList.add("sorting");
      try{chip.setPointerCapture(e.pointerId)}catch(err){}
      paint();
    });
    chip.addEventListener("pointermove",(e)=>{
      if(!drag||drag.el!==chip) return;
      drag.x=e.clientX; drag.y=e.clientY;
      schedule();
      reflow();
    });
    const end=(e)=>{
      if(!drag||drag.el!==chip) return;
      if(frame){cancelAnimationFrame(frame);frame=null;}
      drag=null;
      try{chip.releasePointerCapture(e.pointerId)}catch(err){}
      chip.classList.remove("dragging");
      row.classList.remove("sorting");
      chip.classList.add("settling");
      chip.style.transform="";
      setTimeout(()=>{chip.classList.remove("settling");chip.style.transition="";},470);
    };
    chip.addEventListener("pointerup",end);
    chip.addEventListener("pointercancel",end);
  });
})();

/* ---------- amőba 5×5, 3 kell a nyeréshez (alfa-béta keresés) ---------- */
(function(){
  const HUMAN="X", CPU="O";
  const N=8, CELLS=N*N, NEED=4;          /* 8×8 tábla, 4 kell egy sorban a nyeréshez */

  /* minden 3-hosszú nyerő vonal: vízszintes, függőleges, mindkét átló */
  const WINS=(function(){
    const out=[];
    const span=[...Array(NEED).keys()];
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(c+NEED<=N) out.push(span.map(k=>r*N+c+k));                    /* → */
      if(r+NEED<=N) out.push(span.map(k=>(r+k)*N+c));                  /* ↓ */
      if(r+NEED<=N&&c+NEED<=N) out.push(span.map(k=>(r+k)*N+c+k));     /* ↘ */
      if(r+NEED<=N&&c-NEED+1>=0) out.push(span.map(k=>(r+k)*N+c-k));   /* ↙ */
    }
    return out;
  })();

  let board=Array(CELLS).fill(""), over=false, busy=false;

  const boards=()=>document.querySelectorAll(".ttt-board");
  const statuses=()=>document.querySelectorAll(".ttt-status");

  function winnerOf(b){
    for(const line of WINS){
      const first=b[line[0]];
      if(first && line.every(i=>b[i]===first)) return {player:first, line};
    }
    return b.every(v=>v) ? {player:"draw", line:null} : null;
  }

  /* 25 mezőn a teljes minimax bejárhatatlan, ezért mélységkorlátos alfa-béta.
     A keresés a már lerakott jelek szomszédságára szűkül — blokkolni mindig
     szomszédos mezőn kell, így egy kényszerítő lépés sem eshet ki. */
  const SEARCH_DEPTH=4;

  function emptiesOf(b){ const e=[]; for(let i=0;i<CELLS;i++) if(!b[i]) e.push(i); return e; }

  function candidates(b){
    const set=new Set(); let any=false;
    for(let i=0;i<CELLS;i++){
      if(!b[i]) continue;
      any=true;
      const r=(i/N)|0, c=i%N;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr, nc=c+dc;
        if(nr<0||nr>=N||nc<0||nc>=N) continue;
        const j=nr*N+nc;
        if(!b[j]) set.add(j);
      }
    }
    if(!any) return [((N*N)-1)/2|0];        /* üres tábla: középre */
    return [...set];
  }

  /* pozícióértékelés: minél több saját jel egy még el nem rontott négyesben,
     annál értékesebb. Védekezésre kicsit érzékenyebb, hogy ne hagyjon nyitva hármast. */
  const MINE=[0,1,10,100], THEIRS=[0,1,12,120];
  function evaluate(b){
    let s=0, myThreats=0, oppThreats=0;
    for(const line of WINS){
      let me=0, opp=0;
      for(const i of line){ if(b[i]===CPU) me++; else if(b[i]===HUMAN) opp++; }
      if(me&&opp) continue;                 /* elrontott vonal, egyik félnek sem ér */
      if(me){ s+=MINE[me]; if(me===NEED-1) myThreats++; }
      else if(opp){ s-=THEIRS[opp]; if(opp===NEED-1) oppThreats++; }
    }
    /* villa: két külön vonalon is egy lépésre a nyeréstől — egyszerre nem blokkolható */
    if(oppThreats>=2) s-=600;
    if(myThreats>=2) s+=500;
    return s;
  }

  /* 64 mezőn a nyers keresés lassú volna, ezért a lépéseket előre rangsoroljuk
     (a jónak tűnők jönnek elsőként) és csak a legjobb néhányat vizsgáljuk mélyen */
  const BRANCH=16;
  function orderedMoves(b, turn){
    const scored=candidates(b).map(m=>{
      b[m]=turn; const v=evaluate(b); b[m]="";
      return {m, v:turn===CPU?v:-v};
    });
    scored.sort((a,c)=>c.v-a.v);
    return scored.slice(0,BRANCH).map(x=>x.m);
  }

  function search(b, depth, alpha, beta, turn){
    const res=winnerOf(b);
    if(res){
      if(res.player===CPU) return 1000+depth;
      if(res.player===HUMAN) return -1000-depth;
      return 0;
    }
    if(depth===0) return evaluate(b);
    const moves=orderedMoves(b,turn);
    if(!moves.length) return 0;
    if(turn===CPU){
      let best=-Infinity;
      for(const m of moves){
        b[m]=CPU; const v=search(b,depth-1,alpha,beta,HUMAN); b[m]="";
        if(v>best) best=v;
        if(best>alpha) alpha=best;
        if(alpha>=beta) break;
      }
      return best;
    }
    let best=Infinity;
    for(const m of moves){
      b[m]=HUMAN; const v=search(b,depth-1,alpha,beta,CPU); b[m]="";
      if(v<best) best=v;
      if(best<beta) beta=best;
      if(alpha>=beta) break;
    }
    return best;
  }

  /* azok az üres mezők, ahova <who> lépve AZONNAL nyerne (egy menetben megszámolva) */
  function winCells(b, who){
    const s=new Set();
    for(const line of WINS){
      let mine=0, empty=-1, ok=true;
      for(const i of line){
        if(b[i]===who) mine++;
        else if(!b[i]){ if(empty<0) empty=i; else { ok=false; break; } }
        else { ok=false; break; }
      }
      if(ok && mine===NEED-1 && empty>=0) s.add(empty);
    }
    return s;
  }

  function bestMove(b){
    const empties=emptiesOf(b);
    if(!empties.length) return null;
    /* 1. van azonnali nyerő lépés? */
    for(const i of empties){ b[i]=CPU; const w=winnerOf(b); b[i]=""; if(w&&w.player===CPU) return i; }
    /* 2. az ellenfél nyerne? blokkolni kell */
    for(const i of empties){ b[i]=HUMAN; const w=winnerOf(b); b[i]=""; if(w&&w.player===HUMAN) return i; }
    /* 3. villaszűrés: azokat a lépéseket kerüljük, amik után az ellenfél EGY lépéssel
       két különböző nyerő mezőt tud nyitni — azt már nem lehetne egyszerre blokkolni */
    const all=orderedMoves(b,CPU), safe=[];
    for(const m of all){
      b[m]=CPU;
      let fork=false;
      for(const j of candidates(b)){
        b[j]=HUMAN;
        if(winCells(b,HUMAN).size>=2){ fork=true; }
        b[j]="";
        if(fork) break;
      }
      b[m]="";
      if(!fork) safe.push(m);
    }
    const pool=safe.length?safe:all;

    /* 4. keresés a megmaradt lépések között */
    let best=null, bestVal=-Infinity;
    for(const m of pool){
      b[m]=CPU;
      const v=search(b,SEARCH_DEPTH-1,-Infinity,Infinity,HUMAN);
      b[m]="";
      if(v>bestVal){ bestVal=v; best=m; }
    }
    return best!=null?best:empties[0];
  }

  function buildBoards(){
    boards().forEach(bEl=>{
      if(bEl.childElementCount) return;
      for(let i=0;i<CELLS;i++){
        const cell=document.createElement("div");
        cell.className="ttt-cell";
        cell.dataset.idx=i;
        cell.addEventListener("click",()=>onCellClick(i));
        bEl.appendChild(cell);
      }
    });
  }

  function render(winLine){
    boards().forEach(bEl=>{
      [...bEl.children].forEach((cell,i)=>{
        cell.textContent = board[i]==="X" ? "✕" : board[i]==="O" ? "〇" : "";
        cell.className="ttt-cell"+(board[i]?" taken "+board[i].toLowerCase():"")
          +(winLine&&winLine.includes(i)?" win":"");
      });
    });
    setStatus();
  }

  function setStatus(){
    const d=I18N[currentLang];
    const res=winnerOf(board);
    let text;
    if(res){
      text = res.player===HUMAN ? d.ttt_you_win : res.player===CPU ? d.ttt_you_lose : d.ttt_draw;
    } else if(busy){ text=d.ttt_thinking; }
    else { text=d.ttt_your_turn; }
    statuses().forEach(s=>{ s.textContent=text; });
  }
  window.updateTttStatus=setStatus;

  function finishIfOver(){
    const res=winnerOf(board);
    if(res){ over=true; render(res.line); return true; }
    return false;
  }

  function onCellClick(i){
    if(over || busy || board[i]) return;
    board[i]=HUMAN;
    render();
    if(finishIfOver()) return;
    busy=true; setStatus();
    setTimeout(()=>{
      const mv=bestMove(board.slice());
      if(mv!=null) board[mv]=CPU;
      busy=false;
      render();
      finishIfOver();
    },320);
  }

  function reset(){
    board=Array(CELLS).fill(""); over=false; busy=false;
    render();
  }

  buildBoards();
  render();
  document.querySelectorAll(".ttt-reset").forEach(b=>b.addEventListener("click",reset));
})();


/* ---------- Szeged: hőmérséklet + pontos idő ---------- */
(function(){
  const tempEl=document.getElementById("wx-temp");
  const timeEl=document.getElementById("wx-time");
  const iconEl=document.getElementById("wx-icon");
  if(!tempEl||!timeEl) return;

  /* a kiválasztott város — alapból Szeged; az óra MINDIG az ő helyi ideje */
  let city={name:"Szeged",lat:46.253,lon:20.1414,tz:"Europe/Budapest"};
  try{
    const s=JSON.parse(localStorage.getItem("oi_wx_city")||"null");
    if(s&&s.name&&typeof s.lat==="number") city=s;
  }catch(e){}
  let fmt;
  function makeFmt(){
    try{ fmt=new Intl.DateTimeFormat("hu-HU",{timeZone:city.tz,hour:"2-digit",minute:"2-digit",hour12:false}); }
    catch(e){ fmt=new Intl.DateTimeFormat("hu-HU",{hour:"2-digit",minute:"2-digit",hour12:false}); }
  }
  makeFmt();
  function tick(){ timeEl.textContent=fmt.format(new Date()); }
  tick(); setInterval(tick,1000);
  const nameEl=document.getElementById("wx-city-name");
  if(nameEl) nameEl.textContent=city.name;

  /* WMO időjárás-kódok -> ikon */
  const S='stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const SUN='<svg viewBox="0 0 24 24" '+S+'><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
  const PARTLY='<svg viewBox="0 0 24 24" '+S+'><circle cx="8.5" cy="8" r="3.2"/><path d="M8.5 1.8v1.6M2.3 8h1.6M4.1 3.6l1.1 1.1M12.9 3.6l-1.1 1.1"/><path d="M17.5 20H9a3.6 3.6 0 0 1-.3-7.2 5 5 0 0 1 9.5 1.3 3 3 0 0 1-.7 5.9z"/></svg>';
  const CLOUD='<svg viewBox="0 0 24 24" '+S+'><path d="M17.5 19H8a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.5 1.5 3.3 3.3 0 0 1-.6 6.5z"/></svg>';
  const RAIN='<svg viewBox="0 0 24 24" '+S+'><path d="M17.5 15H8a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.5 1.5 3.3 3.3 0 0 1-.6 6.5z"/><path d="M9 18.2l-.8 2.2M13 18.2l-.8 2.2M17 18.2l-.8 2.2"/></svg>';
  const SNOW='<svg viewBox="0 0 24 24" '+S+'><path d="M17.5 15H8a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.5 1.5 3.3 3.3 0 0 1-.6 6.5z"/><path d="M9 19h.01M13 20.5h.01M16.6 19h.01"/></svg>';
  const FOG='<svg viewBox="0 0 24 24" '+S+'><path d="M17.5 13H8a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.5 1.5 3.3 3.3 0 0 1-.6 6.5z"/><path d="M5 17h14M7 20.5h10"/></svg>';
  const STORM='<svg viewBox="0 0 24 24" '+S+'><path d="M17.5 14H8a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.5 1.5 3.3 3.3 0 0 1-.6 6.5z"/><path d="M13 16.5l-2.5 4h3l-2 3.5"/></svg>';

  function iconFor(code){
    if(code===0) return SUN;
    if(code<=2) return PARTLY;
    if(code===3) return CLOUD;
    if(code===45||code===48) return FOG;
    if(code>=71&&code<=77) return SNOW;
    if(code===85||code===86) return SNOW;
    if(code>=95) return STORM;
    if(code>=51) return RAIN;
    return CLOUD;
  }

  async function fetchOnce(){
    const URL_="https://api.open-meteo.com/v1/forecast?latitude="+city.lat+"&longitude="+city.lon+
               "&current=temperature_2m,weather_code&timezone=auto";
    const r=await fetch(URL_,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    const t=d&&d.current&&d.current.temperature_2m;
    if(t==null) throw new Error("nincs adat");
    tempEl.textContent=Math.round(t)+"°C";
    iconEl.innerHTML=iconFor(d.current.weather_code);
  }
  /* betöltéskor egy elakadt kérés miatt ne maradjon 10 percig üresen: újrapróbálunk */
  async function weather(retries){
    const delays=[4000,12000,40000];
    try{ await fetchOnce(); }
    catch(e){
      const n=retries||0;
      if(n===0&&!tempEl.textContent.includes("°")){ tempEl.textContent="—"; iconEl.innerHTML=CLOUD; }
      if(n<delays.length) setTimeout(()=>weather(n+1),delays[n]);
    }
  }
  window.setWeatherCity=(c)=>{
    city=c; makeFmt(); tick();
    if(nameEl) nameEl.textContent=c.name;
    tempEl.textContent="…";
    weather();
    try{localStorage.setItem("oi_wx_city",JSON.stringify(c))}catch(e){}
  };
  weather();
  setInterval(()=>weather(),10*60*1000);    /* 10 percenként frissül */
})();



/* ---------- az időjárás-widget szabadon áthúzható ---------- */
(function(){
  const el=document.getElementById("wx-widget");
  if(!el) return;
  const KEY="oi_wx_pos";
  const clamp=(v,min,max)=>Math.max(min,Math.min(v,max));

  function put(left,top){
    const r=el.getBoundingClientRect();
    el.classList.add("placed");
    el.style.left=clamp(left,8,innerWidth-r.width-8)+"px";
    el.style.top =clamp(top, 74,innerHeight-r.height-8)+"px";
  }
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&typeof s.left==="number") put(s.left,s.top);
  }catch(e){}

  let drag=null;
  el.addEventListener("pointerdown",(e)=>{
    if(e.button&&e.button!==0) return;
    if(e.target.closest(".wx-gear,.wx-search")) return;   /* beállítás: ne húzza a widgetet */
    const r=el.getBoundingClientRect();
    drag={dx:e.clientX-r.left, dy:e.clientY-r.top};
    el.classList.add("dragging");
    try{el.setPointerCapture(e.pointerId)}catch(err){}
    e.preventDefault();
  });
  el.addEventListener("pointermove",(e)=>{
    if(!drag) return;
    put(e.clientX-drag.dx, e.clientY-drag.dy);
  });
  const end=(e)=>{
    if(!drag) return;
    drag=null;
    el.classList.remove("dragging");
    try{el.releasePointerCapture(e.pointerId)}catch(err){}
    const r=el.getBoundingClientRect();
    try{localStorage.setItem(KEY,JSON.stringify({left:r.left,top:r.top}))}catch(err){}
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  addEventListener("resize",()=>{
    if(!el.classList.contains("placed")) return;
    const r=el.getBoundingClientRect();
    put(r.left,r.top);
  });
})();


/* ---------- városkereső az időjárás-widgetben ---------- */
(function(){
  const wid=document.getElementById("wx-widget");
  const btn=document.getElementById("wx-gear");
  const panel=document.getElementById("wx-search");
  const input=document.getElementById("wx-input");
  const hits=document.getElementById("wx-hits");
  if(!wid||!btn||!panel||!input) return;

  function open(v){
    wid.classList.toggle("searching",v);
    if(v){
      /* ha a widget a képernyő alsó felében van, fölfelé nyíljon */
      panel.classList.toggle("up", wid.getBoundingClientRect().top>innerHeight*0.55);
      input.value=""; hits.innerHTML="";
      setTimeout(()=>input.focus(),30);
    }
  }
  btn.addEventListener("click",(e)=>{ e.stopPropagation(); open(!wid.classList.contains("searching")); });
  panel.addEventListener("pointerdown",(e)=>e.stopPropagation());   /* ne indítson húzást */
  panel.addEventListener("click",(e)=>e.stopPropagation());
  document.addEventListener("click",(e)=>{ if(!wid.contains(e.target)) open(false); });
  input.addEventListener("keydown",(e)=>{
    if(e.key==="Escape"){ open(false); }
    if(e.key==="Enter"){ const f=hits.querySelector(".wx-hit"); if(f) f.click(); }
  });

  let timer=null, seq=0;
  input.addEventListener("input",()=>{
    clearTimeout(timer);
    const q=input.value.trim();
    if(q.length<2){ hits.innerHTML=""; return; }
    timer=setTimeout(()=>search(q),320);
  });

  async function search(q){
    const my=++seq;
    hits.innerHTML='<div class="wx-note">…</div>';
    try{
      const u="https://geocoding-api.open-meteo.com/v1/search?count=6&language=hu&format=json&name="+encodeURIComponent(q);
      const r=await fetch(u);
      const d=await r.json();
      if(my!==seq) return;
      const list=(d&&d.results)||[];
      if(!list.length){ hits.innerHTML='<div class="wx-note">Nincs találat</div>'; return; }
      hits.innerHTML="";
      list.forEach(c=>{
        const b=document.createElement("button");
        b.type="button"; b.className="wx-hit";
        const alatt=[c.admin1,c.country].filter(Boolean).join(" · ");
        b.innerHTML=String(c.name).replace(/[<>]/g,"")+(alatt?'<small>'+alatt.replace(/[<>]/g,"")+'</small>':"");
        b.addEventListener("click",()=>{
          window.setWeatherCity({name:c.name,lat:c.latitude,lon:c.longitude,tz:c.timezone||"auto"});
          open(false);
        });
        hits.appendChild(b);
      });
    }catch(e){
      if(my===seq) hits.innerHTML='<div class="wx-note">Nem sikerült a keresés</div>';
    }
  }
})();


/* ---------- körpálya: az "oi" jel körül a három buborék ---------- */
(function(){
  const orbit=document.getElementById("orbit");
  const core=document.getElementById("orbit-core");
  if(!orbit||!core) return;
  const orbs=[...orbit.querySelectorAll(".orb")];
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let csukva=false;

  function elhelyez(){
    /* a pálya annyi helyet kap, amennyi a fejléc és az alsó sáv között tényleg marad */
    const fej=document.querySelector("header");
    const sav=document.querySelector(".sticky-bar");
    const also=parseFloat(getComputedStyle(document.body).paddingBottom)||
               ((sav?sav.getBoundingClientRect().height:70)+16);
    const heroPad=(()=>{const cs=getComputedStyle(orbit.closest(".hero")||document.body);
      return (parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);})();
    const szabad=innerHeight-(fej?fej.getBoundingClientRect().height:66)-also-heroPad-8;
    orbit.style.height=Math.max(300,Math.min(szabad,520))+"px";
    const w=orbit.clientWidth, hgt=orbit.clientHeight;
    const d=orbs[0]?orbs[0].offsetWidth:92;                 /* buborék átmérő */
    const coreR=core.getBoundingClientRect().width/2;
    /* 6 buborék 60 fokonként: a szomszédos középpontok távolsága = R,
       ezért R >= átmérő + rés, és az oi jelet se lóghassa át */
    const minR=Math.max(d+10, coreR+d/2+14);
    const ferX=(w-d)/2-6, ferY=(hgt-d)/2-6;                 /* ennyi fér el a képernyőn */
    const rx=Math.min(Math.max(minR,w*0.30),ferX,252);
    const ry=Math.min(Math.max(minR,hgt*0.42),ferY,170);
    orbs.forEach((el,i)=>{
      const a=-Math.PI/2 + i*2*Math.PI/orbs.length;    /* 3 buborék 120 fokonként */
      el.dataset.x=(Math.cos(a)*rx).toFixed(1);
      el.dataset.y=(Math.sin(a)*ry).toFixed(1);
    });
    rajzol();
  }
  function rajzol(){
    orbs.forEach(el=>{
      const x=csukva?0:+el.dataset.x, y=csukva?0:+el.dataset.y;
      el.style.transform="translate(-50%,-50%) translate("+x+"px,"+y+"px) scale("+(csukva?0.06:1)+")";
    });
  }
  function valt(){
    if(reduced) return;
    csukva=!csukva;
    orbit.classList.toggle("closed",csukva);
    core.classList.toggle("closed",csukva);
    core.setAttribute("aria-expanded",csukva?"false":"true");
    orbs.forEach((el,i)=>{ el.style.transitionDelay=((csukva?orbs.length-1-i:i)*70)+"ms"; });
    rajzol();
    if(csukva){                                        /* csukáskor a nyitott panelek is záruljanak */
      if(window.setEduOpen) window.setEduOpen(false);
      if(window.setTttOpen) window.setTttOpen(false);
      if(window.setProjOpen) window.setProjOpen(false);
      if(window.setPkgOpen) window.setPkgOpen(false);
    }
  }
  core.addEventListener("click",valt);
  addEventListener("resize",elhelyez);
  elhelyez();
  window.orbitToggle=valt;
})();


/* ---------- projektek panel (csillag buborék) ---------- */
(function(){
  const gomb=document.getElementById("star-toggle");
  const panel=document.getElementById("proj-panel");
  const zaro=document.getElementById("proj-close");
  if(!gomb||!panel) return;
  const elemek=[...panel.querySelectorAll(".proj")];

  function felirat(){                       /* nyelvváltáskor is helyes szöveg */
    const d=I18N[currentLang];
    elemek.forEach(el=>{
      const k=el.classList.contains("open")?el.dataset.desc:el.dataset.name;
      el.textContent=d[k]||"";
    });
  }
  window.renderProjects=felirat;
  felirat();

  elemek.forEach(el=>{
    el.addEventListener("click",()=>{ el.classList.toggle("open"); felirat(); });
  });

  function nyit(v){
    panel.classList.toggle("open",v);
    if(!v) elemek.forEach(el=>el.classList.remove("open")), felirat();
  }
  gomb.addEventListener("click",(e)=>{ e.stopPropagation(); nyit(!panel.classList.contains("open")); });
  if(zaro) zaro.addEventListener("click",()=>nyit(false));
  document.addEventListener("click",(e)=>{
    if(panel.classList.contains("open")&&!panel.contains(e.target)&&e.target!==gomb) nyit(false);
  });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") nyit(false); });
  window.setProjOpen=nyit;
})();
</script>
